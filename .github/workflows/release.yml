name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Nothing is published that has not passed the same checks as any other commit.
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      # Absent secrets are not a failure: the build still produces an installable APK, it is just
      # unsigned, and the release notes say so rather than leaving anyone to find out at install.
      - name: Decode the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        run: ./gradlew assembleRelease

      - name: Name the APK after the tag
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          built=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$built" ]; then echo "No APK was produced" >&2; exit 1; fi
          named="bike-mode-${version}.apk"
          cp "$built" "$named"
          echo "path=$named" >> "$GITHUB_OUTPUT"
          case "$built" in
            *unsigned*) echo "signed=false" >> "$GITHUB_OUTPUT" ;;
            *)          echo "signed=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Note how the APK was signed
        run: |
          if [ "${{ steps.apk.outputs.signed }}" = "true" ]; then
            echo "Signed with the release keystore." > notes.md
          else
            echo "> **This APK is unsigned.** No signing keystore is configured for this repository," > notes.md
            echo "> so Android will refuse to install it until it is signed. See the README." >> notes.md
          fi
          echo "" >> notes.md
          echo "Install with \`adb install ${{ steps.apk.outputs.path }}\`, or open it on the phone." >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "${{ steps.apk.outputs.path }}"
